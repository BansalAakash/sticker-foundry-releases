<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none" role="img" aria-label="Sticker Foundry">
  <defs>
    <!-- Halftone dot pattern for the exposed adhesive cavity -->
    <pattern id="sf-lockup-halftone" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <circle cx="4" cy="4" r="1.7" fill="#0A0A0A" fill-opacity="0.3" />
    </pattern>

    <!-- 3D Metallic Acid-Lime Peel Curl Gradient -->
    <linearGradient id="sf-lockup-curl" x1="295" y1="115" x2="395" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AB800" />
      <stop offset="28%" stop-color="#C6FF00" />
      <stop offset="55%" stop-color="#F4FFB8" />
      <stop offset="78%" stop-color="#C6FF00" />
      <stop offset="100%" stop-color="#6E9400" />
    </linearGradient>

    <!-- Lower Curl Gradient -->
    <linearGradient id="sf-lockup-lower" x1="290" y1="240" x2="390" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#96C800" />
      <stop offset="45%" stop-color="#C6FF00" />
      <stop offset="100%" stop-color="#7DA600" />
    </linearGradient>

    <!-- Drop Shadow for Peeled Flap -->
    <filter id="sf-lockup-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.68" />
    </filter>

    <!-- Clip path for unpeeled left portion of sticker -->
    <clipPath id="sf-lockup-clip">
      <path d="M 286 72
               A 188 188 0 1 0 302 436
               C 292 382, 304 338, 336 304
               C 362 276, 396 270, 420 236
               C 372 192, 314 134, 286 72 Z" />
    </clipPath>

    <!-- Official Google AI Studio Ribbon Gradients (viewBox 0 0 192 192) -->
    <linearGradient id="ais-top-grad" x1="21" y1="62" x2="170" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B95C" />
      <stop offset="38%" stop-color="#00A67E" />
      <stop offset="72%" stop-color="#2884FC" />
      <stop offset="100%" stop-color="#3186FF" />
    </linearGradient>
    <linearGradient id="ais-bot-grad" x1="22" y1="154" x2="168" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3186FF" />
      <stop offset="44%" stop-color="#3885FF" />
      <stop offset="72%" stop-color="#FABC05" />
      <stop offset="100%" stop-color="#FC413D" />
    </linearGradient>

    <!-- Official Gemini 4-Color Spark Gradients (viewBox 0 0 192 192) -->
    <clipPath id="gemini-spark-clip">
      <path d="M164.93,86.68c-13.56-5.84-25.42-13.84-35.6-24.01-10.17-10.17-18.18-22.04-24.01-35.6-2.24-5.2-4.04-10.54-5.42-16.02-.45-1.79-2.06-3.05-3.9-3.05s-3.45,1.26-3.9,3.05c-1.38,5.48-3.18,10.81-5.42,16.02-5.84,13.56-13.84,25.43-24.01,35.6-10.17,10.17-22.04,18.18-35.6,24.01-5.2,2.24-10.54,4.04-16.02,5.42-1.79.45-3.05,2.06-3.05,3.9s1.26,3.45,3.05,3.9c5.48,1.38,10.81,3.18,16.02,5.42,13.56,5.84,25.42,13.84,35.6,24.01,10.17,10.17,18.18,22.04,24.01,35.6,2.24,5.2,4.04,10.54,5.42,16.02.45,1.79,2.06,3.05,3.9,3.05s3.45-1.26,3.9-3.05c1.38-5.48,3.18-10.81,5.42-16.02,5.84-13.56,13.84-25.42,24.01-35.6,10.17-10.17,22.04-18.18,35.6-24.01,5.2-2.24,10.54-4.04,16.02-5.42,1.79-.45,3.05-2.06,3.05-3.9s-1.26-3.45-3.05-3.9c-5.48-1.38-10.81-3.18-16.02-5.42Z" />
    </clipPath>
    <radialGradient id="gem-red" cx="92" cy="18" r="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FC413D" />
      <stop offset="60%" stop-color="#FC413D" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gem-yellow" cx="14" cy="96" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FABC05" />
      <stop offset="55%" stop-color="#FABC05" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gem-green" cx="92" cy="180" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B95C" />
      <stop offset="55%" stop-color="#00B95C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Matte Carbon Black Background -->
  <rect width="800" height="800" rx="64" fill="#0A0A0A" />

  <!-- Centered Emblem Group (Camera Shutter + Peeling Die-Cut Vinyl Sticker) -->
  <g transform="translate(144, 48) scale(1.02)">
    <!-- Outer Die-Cut Vinyl Sticker Base (#F1F1EC) -->
    <path
      d="M 294 54
         A 206 206 0 1 0 310 454
         C 306 410, 332 384, 376 378
         C 412 373, 434 342, 438 292
         C 441 254, 434 224, 412 198
         L 294 54 Z"
      fill="#F1F1EC"
    />

    <!-- Exposed Inner Cavity -->
    <path
      d="M 286 72
         L 402 206
         C 420 228, 424 256, 420 290
         C 416 330, 398 356, 368 360
         C 326 366, 298 392, 302 436
         A 188 188 0 0 1 286 72 Z"
      fill="#141414"
    />

    <!-- Unpeeled Camera Shutter Face -->
    <g clip-path="url(#sf-lockup-clip)">
      <circle cx="248" cy="256" r="186" fill="#0A0A0A" />
      <circle cx="248" cy="256" r="162" stroke="#C6FF00" stroke-width="10" fill="#0A0A0A" />
      <circle cx="248" cy="256" r="144" stroke="#C6FF00" stroke-width="3" stroke-opacity="0.35" fill="none" />

      <!-- Aperture Blades -->
      <g stroke="#C6FF00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <line x1="215" y1="199" x2="298" y2="102" />
        <line x1="281" y1="199" x2="398" y2="256" />
        <line x1="314" y1="256" x2="298" y2="410" />
        <line x1="281" y1="313" x2="118" y2="313" />
        <line x1="215" y1="313" x2="146" y2="142" />
        <line x1="182" y1="256" x2="298" y2="199" />
      </g>

      <!-- Central Hexagonal Whitespace Core -->
      <polygon
        points="215,199 281,199 314,256 281,313 215,313 182,256"
        fill="#F1F1EC"
        stroke="#C6FF00"
        stroke-width="7"
        stroke-linejoin="round"
      />

      <!-- AIS and Gemini Logos in the Whitespace -->
      <g aria-label="Google AI Studio and Gemini in shutter whitespace">
        <!-- Google AI Studio Logo (Left) -->
        <g transform="translate(199, 234) scale(0.22917)">
          <path d="M161.23 55.76 79.92 98.11C53.06 112.1 21.01 92.5 21.01 62.08c0-22.42 18.08-40.59 40.37-40.58l91.57.04c18.88 0 25.04 25.5 8.28 34.22Z" fill="url(#ais-top-grad)" />
          <path d="m30.77 136.24 81.31-42.35c26.86-13.99 58.91 5.61 58.91 36.03 0 22.42-18.08 40.59-40.37 40.58l-91.57-.04c-18.88 0-25.04-25.5-8.28-34.22Z" fill="url(#ais-bot-grad)" />
        </g>

        <!-- Gemini Spark Logo (Right) -->
        <g transform="translate(253, 234) scale(0.22917)" clip-path="url(#gemini-spark-clip)">
          <rect width="192" height="192" fill="#3186FF" />
          <rect width="192" height="192" fill="url(#gem-red)" />
          <rect width="192" height="192" fill="url(#gem-yellow)" />
          <rect width="192" height="192" fill="url(#gem-green)" />
        </g>
      </g>
    </g>

    <!-- Lower Acid-Lime Adhesive Wave -->
    <path
      d="M 302 436
         C 290 384, 294 330, 326 286
         C 340 266, 356 244, 396 246
         C 414 268, 412 316, 392 346
         C 374 370, 324 370, 302 436 Z"
      fill="url(#sf-lockup-lower)"
    />
    <path
      d="M 302 436
         C 290 384, 294 330, 326 286
         C 340 266, 356 244, 396 246
         C 414 268, 412 316, 392 346
         C 374 370, 324 370, 302 436 Z"
      fill="url(#sf-lockup-halftone)"
    />

    <!-- Top-Right 3D Curling Sticker Flap -->
    <path
      d="M 286 72
         C 290 146, 312 212, 362 234
         C 386 244, 408 242, 422 252
         C 414 226, 398 202, 376 176
         L 286 72 Z"
      fill="url(#sf-lockup-curl)"
      filter="url(#sf-lockup-shadow)"
    />

    <!-- Crisp Off-White Die-Cut Edge Highlight along the Peel Fold -->
    <path
      d="M 294 54
         L 412 198
         C 426 216, 434 236, 436 260
         L 422 252
         C 410 230, 394 206, 372 180
         L 286 72 Z"
      fill="#F1F1EC"
    />
  </g>

  <!-- Wordmark Lockup: STICKER (#F1F1EC) FOUNDRY (#C6FF00) in Anton Vector Outlines -->
  <g aria-label="STICKER FOUNDRY">
    <path d="M102.58 665.73Q91.52 665.73 86.63 660.23Q81.74 654.72 81.74 642.69V634.8H97.71V644.9Q97.71 647.7 98.56 649.28Q99.41 650.86 101.52 650.86Q103.72 650.86 104.57 649.58Q105.42 648.29 105.42 645.36Q105.42 641.64 104.69 639.14Q103.95 636.63 102.14 634.36Q100.33 632.09 97.11 629.06L89.86 622.18Q81.74 614.51 81.74 604.64Q81.74 594.32 86.54 588.9Q91.33 583.48 100.42 583.48Q111.53 583.48 116.19 589.41Q120.84 595.33 120.84 607.4H104.41V601.84Q104.41 600.19 103.47 599.27Q102.53 598.36 100.92 598.36Q99 598.36 98.1 599.43Q97.21 600.51 97.21 602.21Q97.21 603.91 98.12 605.88Q99.04 607.86 101.75 610.43L111.07 619.38Q113.87 622.04 116.21 625Q118.55 627.96 119.97 631.88Q121.4 635.81 121.4 641.45Q121.4 652.84 117.2 659.29Q113 665.73 102.58 665.73Z M136.5 665V599.73H126.9V584.22H162.25V599.73H152.65V665Z M168.81 665V584.22H184.41V665Z M212.46 665.73Q203.69 665.73 198.34 660.27Q193 654.81 193 644.99V607.72Q193 595.97 197.66 589.73Q202.31 583.48 212.83 583.48Q218.56 583.48 223.04 585.6Q227.51 587.71 230.08 591.91Q232.65 596.11 232.65 602.49V616.44H216.59V604.51Q216.59 600.88 215.67 599.62Q214.75 598.36 212.83 598.36Q210.58 598.36 209.8 599.98Q209.02 601.61 209.02 604.32V644.76Q209.02 648.11 210 649.49Q210.99 650.86 212.83 650.86Q214.89 650.86 215.74 649.17Q216.59 647.47 216.59 644.76V630.21H232.84V645.49Q232.84 656.14 227.47 660.94Q222.1 665.73 212.46 665.73Z M241.01 665V584.22H256.98V616.58L264.51 584.22H280.76L271.71 621.21L282.64 665H265.88L257.07 625.89V665Z M288.19 665V584.22H320.5V599.82H304.62V615.57H319.86V630.76H304.62V649.26H321.56V665Z M329.68 665V584.22H354.47Q360.66 584.22 363.83 587.04Q367 589.86 368.08 594.94Q369.16 600.01 369.16 606.85Q369.16 613.46 367.48 617.4Q365.81 621.35 361.17 622.87Q364.98 623.65 366.52 626.65Q368.05 629.66 368.05 634.43V665H352.13V633.38Q352.13 629.84 350.68 628.99Q349.24 628.14 346.02 628.14V665ZM346.12 614.14H350.02Q353.37 614.14 353.37 606.85Q353.37 602.12 352.63 600.65Q351.9 599.18 349.88 599.18H346.12Z" fill="#F1F1EC" />
    <path d="M399.31 665V584.22H431.62V599.96H415.56V612.81H430.8V628.37H415.56V665Z M458.89 665.73Q449.2 665.73 444.09 659.88Q438.97 654.03 438.97 642.97V604.6Q438.97 594.22 444.04 588.85Q449.11 583.48 458.89 583.48Q468.66 583.48 473.74 588.85Q478.81 594.22 478.81 604.6V642.97Q478.81 654.03 473.69 659.88Q468.57 665.73 458.89 665.73ZM459.03 650.86Q462.7 650.86 462.7 643.75V604.32Q462.7 598.36 459.12 598.36Q455.08 598.36 455.08 604.46V643.84Q455.08 647.6 456 649.23Q456.91 650.86 459.03 650.86Z M506.81 665.73Q496.71 665.73 491.94 660.07Q487.16 654.4 487.16 643.38V584.22H502.86V642.74Q502.86 644.76 503.09 646.62Q503.32 648.48 504.14 649.67Q504.97 650.86 506.81 650.86Q508.69 650.86 509.51 649.69Q510.34 648.52 510.55 646.64Q510.75 644.76 510.75 642.74V584.22H526.45V643.38Q526.45 654.4 521.68 660.07Q516.9 665.73 506.81 665.73Z M535.45 665V584.22H552.06L559.5 622.91V584.22H575.1V665H559.31L551.24 624.61V665Z M585.06 665V584.22H607.28Q616 584.22 620.41 589.06Q624.81 593.9 624.81 603.22V641.04Q624.81 652.52 620.8 658.76Q616.78 665 606.73 665ZM601.31 650.73H604.11Q608.56 650.73 608.56 646.41V604.74Q608.56 600.7 607.48 599.53Q606.41 598.36 603.1 598.36H601.31Z M634.22 665V584.22H659.01Q665.2 584.22 668.37 587.04Q671.54 589.86 672.61 594.94Q673.69 600.01 673.69 606.85Q673.69 613.46 672.02 617.4Q670.34 621.35 665.71 622.87Q669.52 623.65 671.05 626.65Q672.59 629.66 672.59 634.43V665H656.67V633.38Q656.67 629.84 655.22 628.99Q653.77 628.14 650.56 628.14V665ZM650.65 614.14H654.55Q657.9 614.14 657.9 606.85Q657.9 602.12 657.17 600.65Q656.44 599.18 654.42 599.18H650.65Z M691.59 665V638.42L678.7 584.22H694.72L699.21 611.57L703.71 584.22H719.68L706.83 638.42V665Z" fill="#C6FF00" />
  </g>
</svg>

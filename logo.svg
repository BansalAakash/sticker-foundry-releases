<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none" role="img" aria-label="Sticker Foundry">
  <defs>
    <!-- Halftone dot pattern for the exposed adhesive cavity -->
    <pattern id="sf-lockup-halftone" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <circle cx="4" cy="4" r="1.7" fill="#0A0A0A" fill-opacity="0.3" />
    </pattern>

    <!-- 3D Metallic Acid-Lime Peel Curl Gradient -->
    <linearGradient id="sf-lockup-curl" x1="295" y1="115" x2="395" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AB800" />
      <stop offset="28%" stop-color="#C6FF00" />
      <stop offset="55%" stop-color="#F4FFB8" />
      <stop offset="78%" stop-color="#C6FF00" />
      <stop offset="100%" stop-color="#6E9400" />
    </linearGradient>

    <!-- Lower Curl Gradient -->
    <linearGradient id="sf-lockup-lower" x1="290" y1="240" x2="390" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#96C800" />
      <stop offset="45%" stop-color="#C6FF00" />
      <stop offset="100%" stop-color="#7DA600" />
    </linearGradient>

    <!-- Drop Shadow for Peeled Flap -->
    <filter id="sf-lockup-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.68" />
    </filter>

    <!-- Clip path for unpeeled left portion of sticker -->
    <clipPath id="sf-lockup-clip">
      <path d="M 286 72
               A 188 188 0 1 0 302 436
               C 292 382, 304 338, 336 304
               C 362 276, 396 270, 420 236
               C 372 192, 314 134, 286 72 Z" />
    </clipPath>

    <!-- Official Google AI Studio Ribbon Gradients (viewBox 0 0 192 192) -->
    <linearGradient id="sf-lockup-ais-top" x1="21" y1="62" x2="170" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B95C" />
      <stop offset="38%" stop-color="#00A67E" />
      <stop offset="72%" stop-color="#2884FC" />
      <stop offset="100%" stop-color="#3186FF" />
    </linearGradient>
    <linearGradient id="sf-lockup-ais-bot" x1="22" y1="154" x2="168" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3186FF" />
      <stop offset="44%" stop-color="#3885FF" />
      <stop offset="72%" stop-color="#FABC05" />
      <stop offset="100%" stop-color="#FC413D" />
    </linearGradient>

    <!-- Official Gemini 4-Color Spark Gradients (viewBox 0 0 192 192) -->
    <clipPath id="sf-lockup-gemini-clip">
      <path d="M164.93,86.68c-13.56-5.84-25.42-13.84-35.6-24.01-10.17-10.17-18.18-22.04-24.01-35.6-2.24-5.2-4.04-10.54-5.42-16.02-.45-1.79-2.06-3.05-3.9-3.05s-3.45,1.26-3.9,3.05c-1.38,5.48-3.18,10.81-5.42,16.02-5.84,13.56-13.84,25.43-24.01,35.6-10.17,10.17-22.04,18.18-35.6,24.01-5.2,2.24-10.54,4.04-16.02,5.42-1.79.45-3.05,2.06-3.05,3.9s1.26,3.45,3.05,3.9c5.48,1.38,10.81,3.18,16.02,5.42,13.56,5.84,25.42,13.84,35.6,24.01,10.17,10.17,18.18,22.04,24.01,35.6,2.24,5.2,4.04,10.54,5.42,16.02.45,1.79,2.06,3.05,3.9,3.05s3.45-1.26,3.9-3.05c1.38-5.48,3.18-10.81,5.42-16.02,5.84-13.56,13.84-25.42,24.01-35.6,10.17-10.17,22.04-18.18,35.6-24.01,5.2-2.24,10.54-4.04,16.02-5.42,1.79-.45,3.05-2.06,3.05-3.9s-1.26-3.45-3.05-3.9c-5.48-1.38-10.81-3.18-16.02-5.42Z" />
    </clipPath>
    <radialGradient id="sf-lockup-gem-red" cx="92" cy="18" r="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FC413D" />
      <stop offset="60%" stop-color="#FC413D" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sf-lockup-gem-yellow" cx="14" cy="96" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FABC05" />
      <stop offset="55%" stop-color="#FABC05" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sf-lockup-gem-green" cx="92" cy="180" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B95C" />
      <stop offset="55%" stop-color="#00B95C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3186FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Matte Carbon Black Background -->
  <rect width="800" height="800" rx="64" fill="#0A0A0A" />

  <!-- Centered Emblem Group (Camera Shutter + Peeling Die-Cut Vinyl Sticker) -->
  <g transform="translate(144, 52) scale(1.02)">
    <!-- Outer Die-Cut Vinyl Sticker Base (#F1F1EC) -->
    <path
      d="M 294 54
         A 206 206 0 1 0 310 454
         C 306 410, 332 384, 376 378
         C 412 373, 434 342, 438 292
         C 441 254, 434 224, 412 198
         L 294 54 Z"
      fill="#F1F1EC"
    />

    <!-- Exposed Inner Cavity -->
    <path
      d="M 286 72
         L 402 206
         C 420 228, 424 256, 420 290
         C 416 330, 398 356, 368 360
         C 326 366, 298 392, 302 436
         A 188 188 0 0 1 286 72 Z"
      fill="#141414"
    />

    <!-- Unpeeled Camera Shutter Face -->
    <g clip-path="url(#sf-lockup-clip)">
      <circle cx="248" cy="256" r="186" fill="#0A0A0A" />
      <circle cx="248" cy="256" r="162" stroke="#C6FF00" stroke-width="10" fill="#0A0A0A" />
      <circle cx="248" cy="256" r="144" stroke="#C6FF00" stroke-width="3" stroke-opacity="0.35" fill="none" />

      <!-- 6 Camera Aperture Blades (Hexagonal Iris R=76) -->
      <g stroke="#C6FF00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <line x1="210" y1="190" x2="296" y2="101" />
        <line x1="286" y1="190" x2="401" y2="256" />
        <line x1="324" y1="256" x2="296" y2="411" />
        <line x1="286" y1="322" x2="114" y2="322" />
        <line x1="210" y1="322" x2="144" y2="144" />
        <line x1="172" y1="256" x2="286" y2="190" />
      </g>

      <!-- Central Hexagonal Shutter Whitespace (#F1F1EC) -->
      <polygon
        points="210,190 286,190 324,256 286,322 210,322 172,256"
        fill="#F1F1EC"
        stroke="#C6FF00"
        stroke-width="7"
        stroke-linejoin="round"
      />

      <!-- Official Google AI Studio + Gemini Logos inside the Shutter Whitespace -->
      <g aria-label="Google AI Studio and Gemini">
        <!-- Google AI Studio Icon (Left of center, 44x44 at x=198, y=234) -->
        <g transform="translate(198, 234) scale(0.22917)">
          <path d="M161.23 55.76 79.92 98.11C53.06 112.1 21.01 92.5 21.01 62.08c0-22.42 18.08-40.59 40.37-40.58l91.57.04c18.88 0 25.04 25.5 8.28 34.22Z" fill="url(#sf-lockup-ais-top)" />
          <path d="m30.77 136.24 81.31-42.35c26.86-13.99 58.91 5.61 58.91 36.03 0 22.42-18.08 40.59-40.37 40.58l-91.57-.04c-18.88 0-25.04-25.5-8.28-34.22Z" fill="url(#sf-lockup-ais-bot)" />
        </g>

        <!-- Subtle Center Divider inside Whitespace -->
        <line x1="248" y1="239" x2="248" y2="273" stroke="#0A0A0A" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" />

        <!-- Official Gemini Spark Icon (Right of center, 44x44 at x=254, y=234) -->
        <g transform="translate(254, 234) scale(0.22917)" clip-path="url(#sf-lockup-gemini-clip)">
          <rect width="192" height="192" fill="#3186FF" />
          <rect width="192" height="192" fill="url(#sf-lockup-gem-red)" />
          <rect width="192" height="192" fill="url(#sf-lockup-gem-yellow)" />
          <rect width="192" height="192" fill="url(#sf-lockup-gem-green)" />
        </g>
      </g>
    </g>

    <!-- Lower Acid-Lime Adhesive Wave -->
    <path
      d="M 302 436
         C 290 384, 294 330, 326 286
         C 340 266, 356 244, 396 246
         C 414 268, 412 316, 392 346
         C 374 370, 324 370, 302 436 Z"
      fill="url(#sf-lockup-lower)"
    />
    <path
      d="M 302 436
         C 290 384, 294 330, 326 286
         C 340 266, 356 244, 396 246
         C 414 268, 412 316, 392 346
         C 374 370, 324 370, 302 436 Z"
      fill="url(#sf-lockup-halftone)"
    />

    <!-- Top-Right 3D Curling Sticker Flap -->
    <path
      d="M 286 72
         C 290 146, 312 212, 362 234
         C 386 244, 408 242, 422 252
         C 414 226, 398 202, 376 176
         L 286 72 Z"
      fill="url(#sf-lockup-curl)"
      filter="url(#sf-lockup-shadow)"
    />

    <!-- Crisp Off-White Die-Cut Edge Highlight along the Peel Fold -->
    <path
      d="M 294 54
         L 412 198
         C 426 216, 434 236, 436 260
         L 422 252
         C 410 230, 394 206, 372 180
         L 286 72 Z"
      fill="#F1F1EC"
    />
  </g>

  <!-- Wordmark Lockup: STICKER (#F1F1EC) FOUNDRY (#C6FF00) in Anton Vector Outlines -->
  <g aria-label="STICKER FOUNDRY">
    <path d="M102.58 682.73Q91.52 682.73 86.63 677.23Q81.74 671.72 81.74 659.69V651.8H97.71V661.9Q97.71 664.7 98.56 666.28Q99.41 667.86 101.52 667.86Q103.72 667.86 104.57 666.58Q105.42 665.29 105.42 662.36Q105.42 658.64 104.69 656.14Q103.95 653.63 102.14 651.36Q100.33 649.09 97.11 646.06L89.86 639.18Q81.74 631.51 81.74 621.64Q81.74 611.32 86.54 605.9Q91.33 600.48 100.42 600.48Q111.53 600.48 116.19 606.41Q120.84 612.33 120.84 624.4H104.41V618.84Q104.41 617.19 103.47 616.27Q102.53 615.36 100.92 615.36Q99 615.36 98.1 616.43Q97.21 617.51 97.21 619.21Q97.21 620.91 98.12 622.88Q99.04 624.86 101.75 627.43L111.07 636.38Q113.87 639.04 116.21 642Q118.55 644.96 119.97 648.88Q121.4 652.81 121.4 658.45Q121.4 669.84 117.2 676.29Q113 682.73 102.58 682.73Z M136.5 682V616.73H126.9V601.22H162.25V616.73H152.65V682Z M168.81 682V601.22H184.41V682Z M212.46 682.73Q203.69 682.73 198.34 677.27Q193 671.81 193 661.99V624.72Q193 612.97 197.66 606.73Q202.31 600.48 212.83 600.48Q218.56 600.48 223.04 602.6Q227.51 604.71 230.08 608.91Q232.65 613.11 232.65 619.49V633.44H216.59V621.51Q216.59 617.88 215.67 616.62Q214.75 615.36 212.83 615.36Q210.58 615.36 209.8 616.98Q209.02 618.61 209.02 621.32V661.76Q209.02 665.11 210 666.49Q210.99 667.86 212.83 667.86Q214.89 667.86 215.74 666.17Q216.59 664.47 216.59 661.76V647.21H232.84V662.49Q232.84 673.14 227.47 677.94Q222.1 682.73 212.46 682.73Z M241.01 682V601.22H256.98V633.58L264.51 601.22H280.76L271.71 638.21L282.64 682H265.88L257.07 642.89V682Z M288.19 682V601.22H320.5V616.82H304.62V632.57H319.86V647.76H304.62V666.26H321.56V682Z M329.68 682V601.22H354.47Q360.66 601.22 363.83 604.04Q367 606.86 368.08 611.94Q369.16 617.01 369.16 623.85Q369.16 630.46 367.48 634.4Q365.81 638.35 361.17 639.87Q364.98 640.65 366.52 643.65Q368.05 646.66 368.05 651.43V682H352.13V650.38Q352.13 646.84 350.68 645.99Q349.24 645.14 346.02 645.14V682ZM346.12 631.14H350.02Q353.37 631.14 353.37 623.85Q353.37 619.12 352.63 617.65Q351.9 616.18 349.88 616.18H346.12Z" fill="#F1F1EC" />
    <path d="M399.31 682V601.22H431.62V616.96H415.56V629.81H430.8V645.37H415.56V682Z M458.89 682.73Q449.2 682.73 444.09 676.88Q438.97 671.03 438.97 659.97V621.6Q438.97 611.22 444.04 605.85Q449.11 600.48 458.89 600.48Q468.66 600.48 473.74 605.85Q478.81 611.22 478.81 621.6V659.97Q478.81 671.03 473.69 676.88Q468.57 682.73 458.89 682.73ZM459.03 667.86Q462.7 667.86 462.7 660.75V621.32Q462.7 615.36 459.12 615.36Q455.08 615.36 455.08 621.46V660.84Q455.08 664.6 456 666.23Q456.91 667.86 459.03 667.86Z M506.81 682.73Q496.71 682.73 491.94 677.07Q487.16 671.4 487.16 660.38V601.22H502.86V659.74Q502.86 661.76 503.09 663.62Q503.32 665.48 504.14 666.67Q504.97 667.86 506.81 667.86Q508.69 667.86 509.51 666.69Q510.34 665.52 510.55 663.64Q510.75 661.76 510.75 659.74V601.22H526.45V660.38Q526.45 671.4 521.68 677.07Q516.9 682.73 506.81 682.73Z M535.45 682V601.22H552.06L559.5 639.91V601.22H575.1V682H559.31L551.24 641.61V682Z M585.06 682V601.22H607.28Q616 601.22 620.41 606.06Q624.81 610.9 624.81 620.22V658.04Q624.81 669.52 620.8 675.76Q616.78 682 606.73 682ZM601.31 667.73H604.11Q608.56 667.73 608.56 663.41V621.74Q608.56 617.7 607.48 616.53Q606.41 615.36 603.1 615.36H601.31Z M634.22 682V601.22H659.01Q665.2 601.22 668.37 604.04Q671.54 606.86 672.61 611.94Q673.69 617.01 673.69 623.85Q673.69 630.46 672.02 634.4Q670.34 638.35 665.71 639.87Q669.52 640.65 671.05 643.65Q672.59 646.66 672.59 651.43V682H656.67V650.38Q656.67 646.84 655.22 645.99Q653.77 645.14 650.56 645.14V682ZM650.65 631.14H654.55Q657.9 631.14 657.9 623.85Q657.9 619.12 657.17 617.65Q656.44 616.18 654.42 616.18H650.65Z M691.59 682V655.42L678.7 601.22H694.72L699.21 628.57L703.71 601.22H719.68L706.83 655.42V682Z" fill="#C6FF00" />
  </g>
</svg>
